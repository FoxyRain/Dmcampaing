<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Редактор кампании</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://cdn.quilljs.com/1.3.7/quill.snow.css" rel="stylesheet">
</head>
<body>
    <div class="container">
        <div class="editor-header">
            <button id="backBtn" class="btn-secondary">← Назад</button>
            <h1 id="campaignTitle">Загрузка...</h1>
            <button id="saveBtn" class="btn-primary">💾 Сохранить</button>
            <button id="readBtn" class="btn-primary">📖 Читать</button>
        </div>
        
        <div class="editor-layout">
            <!-- Левая панель: структура -->
            <aside class="sidebar">
                <h3>Главы</h3>
                <button id="addChapterBtn" class="btn-small">+ Добавить главу</button>
                <ul id="chapterList" class="list"></ul>
                
                <h3>NPC</h3>
                <button id="addNpcBtn" class="btn-small">+ Добавить NPC</button>
                <ul id="npcList" class="list"></ul>
                
                <h3>Локации</h3>
                <button id="addLocationBtn" class="btn-small">+ Добавить локацию</button>
                <ul id="locationList" class="list"></ul>
            </aside>
            
            <!-- Центр: редактор -->
            <main class="editor-main">
                <input type="text" id="sceneTitle" placeholder="Название сцены" class="scene-input">
                <div id="editor"></div>
            </main>
        </div>
    </div>
    
    <script src="https://cdn.quilljs.com/1.3.7/quill.min.js"></script>
    <script src="js/editor.js"></script>
</body>
</html>
